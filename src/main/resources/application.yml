server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: ${SERVICE_NAME:catalog-service}
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${POSTGRES_USER:catalog}
    password: ${POSTGRES_PASSWORD:catalog}
  # One schema per service (ADR-0015), with its own history table.
  flyway:
    schemas: ${SERVICE_SCHEMA:catalog}
    default-schema: ${SERVICE_SCHEMA:catalog}
    locations: classpath:db/migration/${SERVICE_SCHEMA:catalog}
  reactor:
    context-propagation: auto

# No authentication until there is a login (LAB-61).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: logstash
