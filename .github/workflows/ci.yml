name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  pipeline:
    uses: leandroamariles/shoplab-ci/.github/workflows/java-service.yml@v1
    with:
      java-version: '21'
      coverage-threshold: 80
      image-name: 'ghcr.io/leandroamariles/catalog-service'
      publish-image: false
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: pipeline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # leandroAmariles, as the owner is written: the signature of the image carries this path.
    uses: leandroAmariles/shoplab-ci/.github/workflows/publish-image.yml@v1
    with:
      image-name: 'ghcr.io/leandroamariles/catalog-service'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
